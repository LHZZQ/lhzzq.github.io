
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ziqian Zhang | Developer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #e5e7eb;
            background: #0f172a;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 10%;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 24px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
        }

        .hero {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 10%;
        }

        .hero h1 {
            font-size: clamp(40px, 7vw, 76px);
            margin: 15px 0;
        }

        .hero h1 span {
            color: #38bdf8;
        }

        .hero p {
            max-width: 600px;
            color: #94a3b8;
            font-size: 20px;
            line-height: 1.7;
        }

        .button {
            display: inline-block;
            width: fit-content;
            margin-top: 24px;
            padding: 14px 28px;
            border-radius: 8px;
            background: #0284c7;
            color: white;
            text-decoration: none;
        }

        .button:hover {
            background: #0369a1;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            nav {
                flex-wrap: wrap;
                gap: 14px;
            }

            nav a {
                margin-left: 0;
                margin-right: 16px;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">ZZQ</div>
        <div>
            <a href="#home">Home</a>
            <a href="https://github.com/LHZZQ">GitHub</a>
        </div>
    </nav>

    <main>
        <section class="hero" id="home">
            <p>Hello, I'm</p>
            <h1>Ziqian <span>Zhang</span></h1>

            <p>
                Computer Science student at the
                University of Bristol.
                Interested in software development,
                game development, and creative projects.
            </p>

            <a class="button"
               href="https://github.com/LHZZQ"
               target="_blank"
               rel="noopener noreferrer">
                View My GitHub
            </a>
        </section>
    </main>

    <footer>
        © 2026 Ziqian Zhang
    </footer>
</body>
</html>
